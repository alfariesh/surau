packages:
  - apps/*
  - packages/*
  - tools/*

# Semua versi dipin di sini; package.json hanya menulis "catalog:" (ADR-008).
catalogMode: strict

catalog:
  # Toolchain (root)
  "@types/node": 24.19.2
  typescript: 7.0.2
  vite-plus: 1.1.0
  wrangler: 4.151.0
  "@opennextjs/cloudflare": 1.20.11

  # Web: Next + React (ADR-003; Next 16.4 lewat sesi X01)
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7

  # Web: HeroUI (ADR-004). Pro dipin PERSIS: ada versi salah terbit 1.0.0-beta.19.
  "@heroui-pro/react": 1.0.0-beta.10
  "@heroui/react": 3.2.6
  "@heroui/styles": 3.2.6
  "@gravity-ui/icons": 2.22.0
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  postcss: 8.5.29

  # Web: dependensi template chat HeroUI Pro (peer opsional Pro)
  "@internationalized/date": 3.12.4
  "@internationalized/number": 3.6.9
  "@number-flow/react": 0.6.2
  "@react-aria/utils": 3.34.1
  "@react-stately/utils": 3.12.1
  "@tiptap/core": 3.31.4
  "@tiptap/extension-blockquote": 3.31.4
  "@tiptap/extension-bold": 3.31.4
  "@tiptap/extension-bubble-menu": 3.31.4
  "@tiptap/extension-bullet-list": 3.31.4
  "@tiptap/extension-code": 3.31.4
  "@tiptap/extension-code-block": 3.31.4
  "@tiptap/extension-document": 3.31.4
  "@tiptap/extension-dropcursor": 3.31.4
  "@tiptap/extension-floating-menu": 3.31.4
  "@tiptap/extension-gapcursor": 3.31.4
  "@tiptap/extension-hard-break": 3.31.4
  "@tiptap/extension-heading": 3.31.4
  "@tiptap/extension-horizontal-rule": 3.31.4
  "@tiptap/extension-italic": 3.31.4
  "@tiptap/extension-link": 3.31.4
  "@tiptap/extension-list": 3.31.4
  "@tiptap/extension-list-item": 3.31.4
  "@tiptap/extension-list-keymap": 3.31.4
  "@tiptap/extension-ordered-list": 3.31.4
  "@tiptap/extension-paragraph": 3.31.4
  "@tiptap/extension-strike": 3.31.4
  "@tiptap/extension-text": 3.31.4
  "@tiptap/extension-underline": 3.31.4
  "@tiptap/extensions": 3.31.4
  "@tiptap/pm": 3.31.4
  "@tiptap/react": 3.31.4
  "@tiptap/starter-kit": 3.31.4
  "@tiptap/suggestion": 3.31.4
  embla-carousel: 8.6.0
  embla-carousel-react: 8.6.0
  marked: 18.1.0
  motion: 12.43.0
  react-aria: 3.53.1
  react-aria-components: 1.22.1
  react-markdown: 10.1.0
  react-resizable-panels: 4.14.4
  react-stately: 3.51.0
  recharts: 3.10.1
  remark-breaks: 4.0.0
  remark-gfm: 4.0.1
  shiki: 4.5.0
  streamdown: 2.7.0
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1

# Build script dependensi harus disetujui eksplisit (pnpm >=11).
allowBuilds:
  "@heroui-pro/react": true
  heroui-pro: true
  esbuild: true
  workerd: true
  # Dibawa CLI heroui-pro untuk akses keychain; tidak dibutuhkan postinstall Pro (unduhan tetap sukses).
  "@zowe/secrets-for-zowe-sdk": false

# Paket berumur <24 jam ditolak (supply chain). Ditulis eksplisit supaya mode strict aktif:
# install GAGAL, bukan diam-diam menambah minimumReleaseAgeExclude. Jangan set ke 0; pakai versi sebelumnya.
minimumReleaseAge: 1440
