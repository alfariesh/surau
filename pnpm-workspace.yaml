packages:
  - apps/*
  - packages/*
  - tools/*

# Semua versi dipin di sini; package.json hanya menulis "catalog:" (ADR-008).
catalogMode: strict

catalog:
  # Toolchain (root)
  "@types/node": 24.19.2
  typescript: 7.0.2
  vite-plus: 1.1.0
  wrangler: 4.151.0
  "@opennextjs/cloudflare": 1.20.11

  # Web: Next + React (ADR-003; Next 16.4 lewat sesi X01)
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7

  # Web: HeroUI (ADR-004). Pro dipin PERSIS: ada versi salah terbit 1.0.0-beta.19.
  "@heroui-pro/react": 1.0.0-beta.10
  "@heroui/react": 3.2.6
  "@heroui/styles": 3.2.6
  "@gravity-ui/icons": 2.22.0
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  postcss: 8.5.29

  # Web: peer wajib HeroUI Pro/OSS. Peer opsional template chat (tiptap, streamdown, shiki, dll.)
  # dihapus di S04; ambil lagi saat Fase 4 butuh (lihat Catatan hasil S04).
  "@internationalized/date": 3.12.4
  "@react-aria/utils": 3.34.1
  motion: 12.43.0
  react-aria: 3.53.1
  react-aria-components: 1.22.1
  react-resizable-panels: 4.14.4
  react-stately: 3.51.0
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  next-themes: 0.4.6

  # Tes e2e (S04): hanya chromium. 1.64.1 belum 24 jam saat dipasang.
  "@playwright/test": 1.64.0
  # Cek aksesibilitas otomatis di e2e (MPL-2.0, hanya devDependency).
  "@axe-core/playwright": 4.13.0

# Build script dependensi harus disetujui eksplisit (pnpm >=11).
allowBuilds:
  "@heroui-pro/react": true
  heroui-pro: true
  esbuild: true
  workerd: true
  # Dibawa CLI heroui-pro untuk akses keychain; tidak dibutuhkan postinstall Pro (unduhan tetap sukses).
  "@zowe/secrets-for-zowe-sdk": false

# Paket berumur <24 jam ditolak (supply chain). Ditulis eksplisit supaya mode strict aktif:
# install GAGAL, bukan diam-diam menambah minimumReleaseAgeExclude. Jangan set ke 0; pakai versi sebelumnya.
minimumReleaseAge: 1440
