packages:
  - apps/*
  - packages/*
  - tools/*

# Semua versi dipin di sini; package.json hanya menulis "catalog:" (ADR-008).
catalogMode: strict

catalog:
  # Toolchain (root)
  "@types/node": 24.19.2
  typescript: 7.0.2
  vite-plus: 1.2.0
  wrangler: 4.151.0
  # Cakupan tes (S05). Dipin PERSIS sama dengan vitest bawaan vite-plus (peer 5.0.4).
  "@vitest/coverage-v8": 5.0.4
  "@opennextjs/cloudflare": 1.20.12

  # Data (S06, ADR-009): tanpa ORM. Zod untuk skema baris + validasi batas sistem.
  zod: 4.6.7
  # Ingest (S07): parser file patch daftar isi (data/patches/*.yaml). Tanpa dependensi, ISC.
  yaml: 2.9.1
  # Tes D1 di workerd (S06). Pengganti @cloudflare/vitest-pool-workers (deprecated); peer vitest ^5.
  "@cloudflare/vitest-plugin": 1.4.2
  # Tipe D1Database untuk packages/* (yang tidak punya wrangler types sendiri).
  "@cloudflare/workers-types": 5.20261014.1

  # LLM (S13, ADR-013): klien resmi Anthropic untuk Message Batches + count_tokens. 0.135.0 dirilis
  # 2026-10-15 (>24 jam). Membawa @opentelemetry/api (Apache-2.0) sebagai dependensi.
  "@anthropic-ai/sdk": 0.135.0

  # MCP publik (S16, ADR-011, ADR-049): SDK v2 server (Workers, stateless dual-era) + client untuk tes.
  # Minimal 2.3.0: server GHSA-jm63, GHSA-46jr, GHSA-rvq5 (GHSA-f897 < 2.1.0); client GHSA-6prh
  # (GHSA-6qxp < 2.2.0). Inspector CLI dipanggil lewat `pnpm dlx` di CI.
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/client": 2.3.1

  # Web: Next + React (ADR-003; naik ke 16.4 di X01). 16.4.2 belum 24 jam saat X01 (16 Okt).
  next: 16.4.1
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

  # Web: HeroUI (ADR-004). Pro dipin PERSIS: ada versi salah terbit 1.0.0-beta.19.
  "@heroui-pro/react": 1.0.0-beta.10
  "@heroui/react": 3.2.6
  "@heroui/styles": 3.2.6
  # Impor CSS selektif (globals.css) butuh impor langsung; samakan dengan versi bawaan @heroui/styles.
  tw-animate-css: 1.4.0
  "@gravity-ui/icons": 2.22.1
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  postcss: 8.5.30

  # Web: peer wajib HeroUI Pro/OSS. Peer opsional template chat (tiptap, streamdown, shiki, dll.)
  # dihapus di S04; ambil lagi saat Fase 4 butuh (lihat Catatan hasil S04).
  "@internationalized/date": 3.12.4
  "@react-aria/utils": 3.34.1
  motion: 12.43.0
  react-aria: 3.53.1
  react-aria-components: 1.22.1
  react-resizable-panels: 4.14.5
  react-stately: 3.51.0
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  next-themes: 0.4.6
  # Latar serat kertas (PaperTexture, WebGL2; sama dengan portofolio pemilik). Masih 0.x: dipin
  # PERSIS, naik versi lewat sesi.
  "@paper-design/shaders-react": 0.0.81

  # Tes e2e (S04): hanya chromium. 1.64.1 belum 24 jam saat dipasang.
  "@playwright/test": 1.64.0
  # Cek aksesibilitas otomatis di e2e (MPL-2.0, hanya devDependency).
  "@axe-core/playwright": 4.13.0

# Build script dependensi harus disetujui eksplisit (pnpm >=11).
allowBuilds:
  "@heroui-pro/react": true
  heroui-pro: true
  esbuild: true
  workerd: true
  # Dibawa CLI heroui-pro untuk akses keychain; tidak dibutuhkan postinstall Pro (unduhan tetap sukses).
  "@zowe/secrets-for-zowe-sdk": false

# Paket berumur <24 jam ditolak (supply chain). Ditulis eksplisit supaya mode strict aktif:
# install GAGAL, bukan diam-diam menambah minimumReleaseAgeExclude. Jangan set ke 0; pakai versi sebelumnya.
minimumReleaseAge: 1440
