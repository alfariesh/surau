# CI Surau: `pnpm verify` (format + lint + typecheck + test + build) di setiap PR dan push ke main.
# Keputusan: ADR-017 (CI/CD), ADR-004 (HeroUI Pro butuh HEROUI_AUTH_TOKEN + cache node_modules).
# Action dipin ke SHA commit; Dependabot (github-actions) memperbarui SHA dan komentar versinya.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    # Hanya PR dari repo ini (termasuk Dependabot). PR dari fork tidak mendapat secret,
    # dan kita sengaja tidak memakai pull_request_target.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # HEROUI_AUTH_TOKEN hanya diberikan ke langkah cek dan install di action `siapkan`
    # (tempat postinstall Pro berjalan), tidak ke `pnpm verify` (ADR-024).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cek token HeroUI, vp + Node, cache node_modules, dan install (ADR-024: token hanya di sana).
      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: pnpm verify
        run: pnpm verify
