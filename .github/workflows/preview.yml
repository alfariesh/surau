# Preview per PR: build OpenNext → `wrangler preview --name pr-<nomor>` → komentar URL di PR.
# Job `preview-mcp` membuat Preview Worker MCP yang sama namanya dan mengujinya dengan Inspector (S16).
# Saat PR ditutup, Preview-nya dihapus. Keputusan: ADR-017 (CI/CD), ADR-026 (deploy Cloudflare).
# Preview memakai binding dari blok `previews` di apps/web/wrangler.jsonc (resource khusus preview),
# kecuali WORKER_SELF_REFERENCE yang selalu memanggil deployment produksi (keterbatasan Workers).
# Cache R2 preview tidak diisi saat build: halaman ISR dirender on-demand. Cukup untuk smoke test.
# Setelah e2e, ringkasan request/error Preview dibaca dari GraphQL Analytics (ADR-031), karena
# `wrangler tail` belum mendukung Previews. Ringkasan ada di log CI, Summary job, dan komentar PR.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: preview
    # Hanya PR dari repo ini. PR fork tidak mendapat secret; PR Dependabot tidak diberi token
    # Cloudflare (secret Dependabot terpisah), jadi dilewati. Kita tidak memakai pull_request_target.
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hanya memeriksa ada/tidaknya secret; nilainya tidak masuk ke langkah ini.
      - name: Cek secret Cloudflare
        env:
          ADA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ADA_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$ADA_TOKEN" != "true" ] || [ "$ADA_ACCOUNT" != "true" ]; then
            echo "::error title=Secret Cloudflare kosong::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID belum diisi. Lihat T-06 di implementasi/TUGAS-PEMILIK.md."
            exit 1
          fi

      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Build OpenNext
        run: pnpm --filter @surau/web exec opennextjs-cloudflare build

      # Token Cloudflare hanya diberikan ke langkah ini dan ke "Ringkasan log Preview" (baca analytics). JSON ke stdout, log wrangler ke stderr.
      - name: Buat Preview
        id: preview
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          # Awal jendela waktu untuk ringkasan log Preview (langkah terakhir).
          echo "mulai=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          pnpm exec wrangler preview --name "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER}" --json > "$RUNNER_TEMP/preview.out"
          # Di CI wrangler menulis teks lain (banner/telemetri) ke stdout sebelum JSON: ambil mulai baris "{".
          sed -n '/^{/,$p' "$RUNNER_TEMP/preview.out" > "$RUNNER_TEMP/preview.json"
          if ! url=$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/preview.json"); then
            echo "::error title=Keluaran wrangler preview tidak terbaca::Lihat keluaran di bawah."
            cat "$RUNNER_TEMP/preview.out"
            exit 1
          fi
          deployment_url=$(jq -er '.deployment.urls[0]' "$RUNNER_TEMP/preview.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          for p in / /home /tentang; do
            code=$(curl -s --fail -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$URL$p" || true)
            echo "$p → $code"
            [ "$code" = "200" ] || { echo "::error title=Smoke gagal::$p mengembalikan $code"; exit 1; }
          done

      # Satu komentar per PR yang diperbarui setiap push (bukan komentar baru tiap kali).
      - name: Komentar URL di PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat > "$RUNNER_TEMP/komentar.md" <<EOF
          **Preview Surau siap** untuk commit \`${SHA:0:7}\`

          - Preview PR (selalu versi terbaru): ${URL}
          - Deployment ini saja: ${DEPLOYMENT_URL}

          Storage memakai resource khusus preview (cache R2 \`surau-next-cache-preview\`), bukan data produksi.
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/komentar.md" --edit-last --create-if-none

      # Smoke e2e (Playwright, chromium) terhadap preview PR: runtime Workers, bukan `next dev` (S04).
      # Dijalankan setelah komentar supaya URL preview tetap terpasang walau e2e gagal.
      - name: Pasang chromium Playwright
        run: pnpm --filter @surau/web exec playwright install --with-deps chromium

      - name: e2e terhadap preview
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm test:e2e

      # Juga saat e2e gagal: justru saat itu log Worker paling dibutuhkan. Gagal hanya bila ada
      # invocation yang gagal (exception dsb.); token tanpa izin Analytics cukup peringatan (T-21).
      - name: Ringkasan log Preview
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.preview.outputs.mulai }}
        run: |
          export PREVIEW_SLUG="pr-${PR_NUMBER}" RINGKASAN_MD="$RUNNER_TEMP/log-preview.md"
          status=0
          bash .github/scripts/ringkas-log-preview.sh || status=$?
          # Skrip bisa berhenti sebelum menulis ringkasan (mis. env kosong): jangan sampai `cat` gagal.
          [ -s "$RINGKASAN_MD" ] || printf '### Log Preview\n\nTidak terbaca (skrip keluar %s, lihat log CI).\n' "$status" > "$RINGKASAN_MD"
          cat "$RINGKASAN_MD" >> "$GITHUB_STEP_SUMMARY"
          # Tambahkan ke komentar preview yang sama. Bila smoke gagal, komentar URL tidak ditulis dan
          # ringkasan hanya ada di log CI + Summary (komentar lama tidak ditimpa).
          if [ -f "$RUNNER_TEMP/komentar.md" ]; then
            { echo; cat "$RINGKASAN_MD"; } >> "$RUNNER_TEMP/komentar.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/komentar.md" --edit-last --create-if-none
          fi
          exit "$status"

  # Preview Worker MCP (S16, ADR-049): `wrangler preview` di apps/mcp (binding dari blok `previews`:
  # korpus staging, namespace rate limit 4001–4003), lalu MCP Inspector CLI di KEDUA era protokol
  # (.github/scripts/uji-mcp.sh). URL ada di log dan Summary job, tidak di komentar PR (komentar
  # Preview web diperbarui dengan `--edit-last`, jadi job ini tidak ikut menulis komentar).
  preview-mcp:
    name: preview mcp
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cek secret Cloudflare
        env:
          ADA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ADA_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$ADA_TOKEN" != "true" ] || [ "$ADA_ACCOUNT" != "true" ]; then
            echo "::error title=Secret Cloudflare kosong::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID belum diisi. Lihat T-06 di implementasi/TUGAS-PEMILIK.md."
            exit 1
          fi

      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Buat Preview MCP
        id: preview
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          pnpm exec wrangler preview --name "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER}" --json > "$RUNNER_TEMP/preview.out"
          sed -n '/^{/,$p' "$RUNNER_TEMP/preview.out" > "$RUNNER_TEMP/preview.json"
          if ! url=$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/preview.json"); then
            echo "::error title=Keluaran wrangler preview tidak terbaca::Lihat keluaran di bawah."
            cat "$RUNNER_TEMP/preview.out"
            exit 1
          fi
          echo "url=${url%/}/mcp" >> "$GITHUB_OUTPUT"
          echo "Preview MCP: ${url%/}/mcp" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Uji MCP (Inspector, era modern + legacy)
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: bash .github/scripts/uji-mcp.sh "$URL" lengkap

      # Endpoint penulis konten (X23, ADR-125): 12 tool (8 baca + 4 redaksi).
      - name: Uji MCP /redaksi (Inspector, era modern + legacy)
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: bash .github/scripts/uji-mcp.sh "${URL%/mcp}/redaksi" redaksi

  hapus:
    name: hapus preview
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Hanya Node + pnpm (tanpa install workspace); versi wrangler dibaca dari catalog.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            package.json
            pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: false
          run-install: false

      # Preview bisa saja tidak pernah dibuat (build gagal, secret belum ada): jangan buat PR merah.
      - name: Hapus Preview pr-<nomor>
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          versi=$(sed -nE 's/^  wrangler: ([0-9.]+)$/\1/p' pnpm-workspace.yaml)
          # Tanpa versi, `pnpm dlx wrangler@` akan mengambil versi terbaru yang tidak dipin.
          [ -n "$versi" ] || { echo "::error title=Versi wrangler tidak terbaca::Cek catalog di pnpm-workspace.yaml"; exit 1; }
          for worker in surau-web surau-mcp; do
            if ! pnpm dlx "wrangler@${versi}" preview delete --name "pr-${PR_NUMBER}" --worker-name "$worker" --skip-confirmation; then
              echo "::warning title=Preview tidak terhapus::pr-${PR_NUMBER} (${worker}) tidak ditemukan atau gagal dihapus. Cek di dashboard Cloudflare bila perlu."
            fi
          done
