# Deploy produksi: setiap push ke main → Worker Jawab `surau-api` + `surau-api-staging` (S19, tanpa
# route publik) → build OpenNext → deploy Worker `surau-web` (https://surau.org), lalu Worker MCP
# `surau-mcp` (https://mcp.surau.org/mcp, S16) setelah web lolos smoke. surau-api lebih dulu karena
# service binding `API` milik web gagal di-deploy bila Worker tujuannya belum ada.
# Keputusan: ADR-017 (CI/CD), ADR-026 (deploy Cloudflare). Migrasi D1 HANYA `surau-app` (S10): korpus
# tidak pernah diubah dari sini, hanya lewat `pnpm run corpus:promote` (blue-green, ARSITEKTUR-TEKNIS §7
# aturan 4; dijaga tes tools/ingest/src/corpus.test.ts).
# `main` hanya berubah lewat PR yang lolos `verify` (ADR-025), jadi workflow ini tidak mengulang verify.
# Push yang HANYA mengubah prosa (dokumen, rencana, laporan, Markdown) tidak men-deploy (#68): tidak ada
# yang dibundel ke Worker dari sana. Push campuran kode + prosa tetap deploy. Deploy manual: Actions →
# Deploy → Run workflow. `paths-ignore` sengaja tidak dipasang di ci.yml: `verify` adalah required
# check, dan workflow yang dilewati akan memblokir merge.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "implementasi/**"
      - "evals/reports/**"
      - "data/reports/**"
      - ".claude/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Deploy produksi tidak pernah dibatalkan di tengah jalan; yang berikutnya menunggu.
concurrency:
  group: deploy-produksi
  cancel-in-progress: false

jobs:
  # Worker Jawab (S19, ADR-064): migrasi app dulu (answer_cache), lalu Worker produksi. Jawab
  # produksi tetap mati (`settings.jawab_enabled` = 0, `JAWAB_ROUTE_ENABLED` web = "0") sampai S20.
  deploy-api:
    name: deploy api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: produksi-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cek secret Cloudflare
        env:
          ADA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ADA_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$ADA_TOKEN" != "true" ] || [ "$ADA_ACCOUNT" != "true" ]; then
            echo "::error title=Secret Cloudflare kosong::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID belum diisi. Lihat T-06 di implementasi/TUGAS-PEMILIK.md."
            exit 1
          fi

      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      # Hanya binding APP (`surau-app`); korpus tidak pernah dimigrasi dari sini (ARSITEKTUR-TEKNIS §7
      # aturan 4). Migrasi app sudah ada sebelum kode yang membaca tabel barunya aktif.
      - name: Migrasi D1 surau-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run db:migrate:remote

      - name: Deploy Worker Jawab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @surau/api run deploy:api

  # Worker staging yang dipanggil Preview web (`previews.services`). Terpisah supaya kegagalannya
  # tidak memblokir deploy web produksi. Catatan: staging mengikuti `main`, jadi Preview sebuah PR
  # memanggil kode API versi main, bukan kode API dari PR itu (ADR-064); PR yang mengubah apps/api
  # menguji API-nya dengan deploy staging dari branch atas izin pemilik.
  deploy-api-staging:
    name: deploy api staging
    needs: deploy-api
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Migrasi D1 surau-app-staging + deploy surau-api-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run db:migrate:app-staging
          pnpm --filter @surau/api run deploy:api-staging

  deploy:
    name: deploy
    needs: deploy-api
    # workflow_dispatch hanya boleh dari main: branch lain belum lolos `verify`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: produksi
      url: https://surau.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hanya memeriksa ada/tidaknya secret; nilainya tidak masuk ke langkah ini.
      - name: Cek secret Cloudflare
        env:
          ADA_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ADA_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$ADA_TOKEN" != "true" ] || [ "$ADA_ACCOUNT" != "true" ]; then
            echo "::error title=Secret Cloudflare kosong::CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID belum diisi. Lihat T-06 di implementasi/TUGAS-PEMILIK.md."
            exit 1
          fi

      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Build OpenNext
        run: pnpm --filter @surau/web exec opennextjs-cloudflare build

      # Migrasi app sebelum kode baru aktif. `db:migrate:remote` hanya menyentuh binding APP
      # (`surau-app`); migrasi yang sudah diterapkan dilewati, jadi aman diulang.
      - name: Migrasi D1 surau-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run db:migrate:remote

      # Token Cloudflare hanya diberikan ke langkah migrasi dan deploy. `deploy` juga mengisi cache R2 produksi.
      - name: Deploy ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @surau/web exec opennextjs-cloudflare deploy

      - name: Smoke test produksi
        run: |
          # Beberapa detik setelah deploy, sebagian permintaan masih dilayani versi Worker lama
          # (S04: `/` sempat 307 dari template). Ulangi sampai 200, paling lama ±60 detik per halaman.
          for p in / /tentang /lisensi /mcp /kitab /kitab/ihya/1/200; do
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://surau.org$p" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$p → $code (percobaan $i)"
            [ "$code" = "200" ] || { echo "::error title=Smoke gagal::$p mengembalikan $code"; exit 1; }
          done

  # Worker MCP (S16, ADR-049): custom domain mcp.surau.org dari `routes` di apps/mcp/wrangler.jsonc
  # (DNS + sertifikat dibuat wrangler). Tanpa migrasi D1: Worker ini hanya membaca D1 yang sama
  # dengan web. Setelah web, supaya keduanya tidak berganti binding dengan urutan acak.
  deploy-mcp:
    name: deploy mcp
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: produksi-mcp
      url: https://mcp.surau.org/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/siapkan
        with:
          heroui-auth-token: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Deploy Worker MCP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @surau/mcp run deploy:mcp

      # Inspector di kedua era: tools/list + list_works (data produksi tidak diuji penuh di sini).
      # Deploy pertama menerbitkan sertifikat custom domain: coba ulang sampai ±5 menit.
      - name: Smoke MCP produksi
        env:
          MAX_COBA: "30"
          JEDA: "10"
        run: bash .github/scripts/uji-mcp.sh https://mcp.surau.org/mcp daftar
