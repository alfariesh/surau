# Ledger kitab Surau (X31a, ADR-135, ADR-137). Satu baris per kitab yang dipakai atau direncanakan.
# Tanpa teks kitab: hanya ID sumber, versi, edisi, dan keputusan. Judul Arab tidak ditulis di sini
# (disalin kode dari Shamela). Kolom:
#   slug            slug karya (beku saat tayang, ADR-029)
#   shamela         ID buku Shamela (drive pemilik, hanya baca)
#   openiti         versi OpenITI ber-ID Shamela sama (dasar lisensi, ADR-018); rilis + repo
#   edisi           penerbit, kota, tahun cetak, pentahqiq (dari kolom bibliografi Shamela)
#   wafat_h         tahun wafat penulis (H)
#   lisensi         lisensi teks digital
#   catatan_kaki    classical | modern_editor | none | unknown (ADR-138)
#   status          tayang | staging | rencana | arsip (arsip = tidak ikut build bawaan dan turun dari
#                   produksi pada promote berikutnya; data dan peta ID tetap disimpan, ADR-142)
#   intisari_bab    judul tingkat teratas daftar isi yang mendapat Intisari Bab (X31b–d); diisi saat
#                   sesi kitab itu, sebagai title.id Shamela
