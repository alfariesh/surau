# Patch daftar isi al-Muqaddimah al-Hadhramiyyah (Shamela 6125, ADR-152 tambahan). Hanya ID dan
# struktur: judul node disalin dari paragraf pembukanya di halaman sumber.
#
# Shamela hanya menandai 99 "fasl" (dan satu bab, title 20) sebagai `title`, semuanya di akar.
# Judul "kitab" ada sebagai teks sebaris di awal paragraf ("=كتاب … = …"), judul "bab" diapit
# artefak konversi "- صلى الله عليه وسلم - باب … - صلى الله عليه وسلم -" (sama di OpenITI). Keduanya
# menjadi node patch; `prefix` melewati artefak itu sehingga judul node hanya "باب …".
# "باب الصلاة" (page.id 34) berfungsi sebagai kitab shalat dan ditaruh di akar; bab shalat lain
# menjadi anaknya. Fasl mengikuti kitab/bab terakhir sebelumnya menurut urutan teks.
shamela_book: 6125

add:
  # Mukadimah penulis di page.id 1, sebelum judul pertama.
  - { id: muqaddimah, parent: 0, page: 1, heading: مقدمة }
  - { id: kitab-thaharah, parent: 0, page: 2, heading: كتاب الطهارة }
  - id: bab-tayammum
    parent: kitab-thaharah
    page: 27
    prefix: صلى الله عليه وسلم
    heading: باب التيمم
