# Leksikon lafal suara AI bahasa Indonesia (X17, ADR-097 butir 6). Dipakai `tools/audio` SESUDAH skrip
# Intisari dibangun: tidak mengubah isi atau sha skrip, hanya cara suara AI melafalkan istilah/nama.
# Versi leksikon = 12 heks pertama sha256 entri `active` (dicatat di data/audio/*-audio.json); draf `test`
# dan komentar tidak mengubah versi.
#
# - `ipa`: lafal IPA tanpa garis miring; alat menulisnya inline `/…/` (eleven_v4, docs dicek 2026-10-24).
#   Lafal mengikuti ucapan lazim pengajar Indonesia untuk istilah serapan Arab, bukan tajwid.
# - `alias`: ejaan pengganti bila IPA tidak menolong.
# - `status: test` = DRAF agent, belum diterapkan; `pnpm audio sample` memperdengarkan lafal bawaan lalu
#   lafal ini berdampingan untuk uji dengar pemilik (T-31). `status: active` = diterapkan di semua audio,
#   hanya sesudah uji dengar menunjukkan lafal bawaan salah ("T-31 … lafal salah: …").
# Istilah diambil dari daftar uji T-31, glosarium Intisari (X15b), dan tokoh yang sering muncul di Ihya.
# Teks Arab tidak ditulis di sini.
format: 1
lang: id
entries:
  # Istilah (daftar uji T-31 + glosarium)
  - term: ikhlas
    ipa: ixˈlas
    status: test
  - term: riya'
