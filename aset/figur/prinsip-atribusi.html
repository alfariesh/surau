<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atribusi, bukan fatwa</title>
</head>
<body>
<script src="../../.claude/skills/aset/mesin/iso.js"></script>
<script>
/* Prinsip 3 · Atribusi, bukan fatwa.
   Proses: kartu pernyataan di alas → "siapa yang mengatakan?" → kabel menyala dari kartu ke kitab sumbernya,
   label MENURUT PENULIS muncul. Surau menyampaikan isi kitab beserta penuturnya; ia tidak mengeluarkan putusan,
   jadi stempel "putusan" di alas tetap redup dan tidak pernah menyala.
   Tanpa nama ulama, wajah, atau huruf Arab. */
const { ease } = ISO;
const st = { atribusi: 1, busy: false };

mountFigure({
  id: 'prinsip-atribusi', title: 'Atribusi, bukan fatwa',
  hint: 'tunjukkan siapa yang mengatakan',
  alt: 'Ilustrasi garis: kartu pernyataan dihubungkan kabel yang menyala ke kitab sumbernya dengan label "menurut penulis". Stempel putusan di sampingnya tetap redup.',
  ulang: 7000,
  tombol: [{ label: 'Siapa yang mengatakan?', aksi: () => H.tunjukkan() }],
  mount(stage, api) {
    const K = api.frame([[0,0,0],[60,0,0],[0,46,0],[60,46,0],[8,6,30],[16,6,30],[46,26,20]]);
    const { box, FRONT, TOP } = K;
    const BOOK = [8, 6, 2, 7, 16, 22], CARD = [34, 24, 2, 18, 2, 16], STAMP = [14, 36, 2, 9, 9];
    const kotakTepi = (x, y, z, w, d, h) => { const c = [[x, y, z], [x + w, y, z], [x, y + d, z], [x + w, y + d, z]]; return K.tepi([...c, ...c.map(p => [p[0], p[1], z + h])]); };
    function draw() {
      const on = st.atribusi >= 1;
      let s = box(0, 0, 0, 60, 46, 2, 5);
      // stempel putusan: silinder pendek yang sengaja redup (Surau tidak memutus perkara)
      const [sx, sy, sz, sr, sh] = STAMP;
      s += `<g class="redup">${box(sx - sr / 2, sy - sr / 2, sz, sr, sr, 2, sr / 2)}${box(sx - 1.2, sy - 1.2, sz + 2, 2.4, 2.4, 4.5, 1.2)}${box(sx - 2.2, sy - 2.2, sz + 6.5, 4.4, 4.4, 1.6, 2.2)}</g>`;
      // kitab sumber berdiri
      const [bx, by, bz, bw, bd, bh] = BOOK;
      s += box(bx, by, bz, bw, bd, bh, 0, on ? 'hot' : '');
      s += `<g transform="${FRONT(bx, by + bd, bz + bh)}"><line class="${on ? 'nyala' : 'detail'}" x1="1" y1="3.5" x2="${bw - 1}" y2="3.5"/><line class="${on ? 'nyala' : 'detail'}" x1="1" y1="${bh - 3.5}" x2="${bw - 1}" y2="${bh - 3.5}"/></g>`;
      s += kotakTepi(bx, by, bz, bw, bd, bh);
      // kartu pernyataan: tanda kutip Latin + baris
      const [cx, cy, cz, cw, cd, ch] = CARD;
      s += box(cx, cy, cz, cw, cd, ch, 0) + `<g transform="${FRONT(cx, cy + cd, cz + ch)}"><text class="label" x="2" y="6.5" style="font-size:7px;font-weight:800">&#8220;</text>`
        + [0, 1, 2].map(i => `<line class="detail" x1="2" y1="${8 + i * 2.6}" x2="${i === 2 ? 9 : cw - 2}" y2="${8 + i * 2.6}"/>`).join('') + '</g>';
      s += kotakTepi(cx, cy, cz, cw, cd, ch);
      // kabel atribusi: dari kartu ke kitab
      const pts = api.kurva([cx + 3, cy, cz + ch - 1], [bx + bw / 2, by + bd / 2, bz + bh], 8);
      const k = Math.max(2, Math.round(pts.length * ease(st.atribusi)));
      if (st.atribusi > 0) s += `<path class="wire hot" d="${K.path(pts.slice(0, k))}"/>`;
      s += `<path class="pulse" id="pt-pulse" pathLength="1000" d="${K.path(pts)}"/>`;
      if (on) s += api.tag(pts[Math.floor(pts.length / 2)], 24, -10, 'MENURUT PENULIS', true, false);
      s += api.tag([sx - 2, sy + 2, sz + 2], -14, 22, 'BUKAN PUTUSAN', false);
      api.gambar(s);
      void TOP;
    }
    const read = () => api.readout(st.atribusi >= 1 ? 'Pernyataan disampaikan bersama penuturnya: menurut penulis kitab' : 'Pernyataan belum diberi sumber');
    const H = window.H = {
      tunjukkan() { if (st.busy) return; st.busy = true; st.atribusi = 0; draw();
        api.anim(1000, t => { st.atribusi = t; draw(); }, () => { st.busy = false; draw(); read(); api.replay(stage.querySelector('#pt-pulse')); }); },
    };
    draw(); read();
    return {
      render: draw,
      demo() { H.tunjukkan(); },
      akhir() { st.atribusi = 1; draw(); read(); },
    };
  },
});
</script>
</body>
</html>
