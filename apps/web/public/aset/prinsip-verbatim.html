<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verbatim atau tidak sama sekali</title>
</head>
<body>
<style id="token-surau">:root{--background:oklch(0.975 0.008 90);--foreground:oklch(0.23 0.015 85);--surface:oklch(0.995 0.004 90);--surface-secondary:oklch(0.96 0.01 90);--surface-tertiary:oklch(0.945 0.012 90);--overlay:oklch(0.995 0.004 90);--default:oklch(0.935 0.012 90);--default-foreground:var(--foreground);--muted:oklch(0.47 0.02 85);--border:oklch(0.89 0.012 90);--separator:oklch(0.91 0.01 90);--field-background:var(--surface);--accent:oklch(0.47 0.085 150);--accent-foreground:oklch(0.99 0.005 90);--link:var(--accent)}:root[data-tema=gelap]{--background:oklch(0.17 0.008 85);--foreground:oklch(0.95 0.008 90);--surface:oklch(0.215 0.01 85);--surface-secondary:oklch(0.245 0.01 85);--surface-tertiary:oklch(0.265 0.01 85);--overlay:oklch(0.23 0.01 85);--default:oklch(0.28 0.01 85);--muted:oklch(0.74 0.015 90);--border:oklch(0.3 0.01 85);--separator:oklch(0.27 0.01 85);--field-background:var(--surface);--accent:oklch(0.79 0.1 150);--accent-foreground:oklch(0.2 0.03 150)}:root[data-tema=sepia]{--background:oklch(0.955 0.016 78);--foreground:oklch(0.27 0.03 60);--surface:oklch(0.97 0.013 78);--surface-secondary:oklch(0.93 0.024 78);--surface-tertiary:oklch(0.915 0.026 78);--overlay:oklch(0.97 0.013 78);--default:oklch(0.91 0.024 78);--muted:oklch(0.44 0.04 62);--border:oklch(0.86 0.024 76);--separator:oklch(0.88 0.022 76);--field-background:var(--surface);--accent:oklch(0.44 0.08 150)}</style>
<script src="/aset-mesin/iso-56d096dded.js"></script>
<script>
/* Prinsip 1 · Verbatim atau tidak sama sekali.
   Proses: kitab terbuka di alas (sumber) → satu baris ditandai → disalin kode lewat jejak di alas ke kartu kutipan →
   kartu dicocokkan dengan sumber. Cerita (sekali jalan): salinan keliru (satu baris berbeda) → kartu meredup dengan
   lencana silang; lalu salinan yang sama persis → kartu menyala dengan lencana centang. Tanpa kata di gambar
   (situs tiga bahasa); baris teks hanya garis; tidak ada huruf Arab. */
const { lerp } = ISO;
const st = { salin: 1, cocok: true, busy: false };
const N = 6;

mountFigure({
  id: 'prinsip-verbatim', title: 'Verbatim atau tidak sama sekali',
  hint: 'salin kutipan dari kitab, atau coba kutipan yang keliru',
  alt: 'Ilustrasi garis: baris dari kitab terbuka disalin lewat kabel ke kartu kutipan. Bila sama persis, kartu menyala; bila keliru, kartu meredup dan tidak ditampilkan.',
  tombol: [
    { label: 'Salin', aksi: () => H.salin(true) },
    { label: 'Kutipan keliru', aksi: () => H.salin(false) },
  ],
  mount(stage, api) {
    const K = api.frame([[0,0,0],[60,0,0],[0,46,0],[60,46,0],[38,8,25],[54,8,25]]);
    const { box, line, FRONT, TOP } = K;
    // jejak di alas (seperti jalur di papan sirkuit): dari sisi kitab sejajar baris yang ditandai, sejajar x,
    // lalu sejajar y ke kaki muka kartu. Menempel di permukaan alas, tidak melayang.
    const Z = 2.05, A = [32.9, 32, Z], B = [44, 10.6, Z];
    const RUTE = api.sampel(api.jalur([A, [44, 32, Z], B], 2.2), 80);
    function draw() {
      let s = box(0, 0, 0, 60, 46, 2, 5);
      // kitab terbuka di alas: dua halaman datar
      for (const [x0, w] of [[6, 13], [19.4, 13]]) {
        s += box(x0, 14, 2, w, 26, 1.6, 1);
        let g = '';
        for (let i = 0; i < 9; i++) {
          const v = 3 + i * 2.5, hot = x0 > 10 && i === 6, u0 = i === 8 ? 5 : 2;
          g += hot ? `<line class="nyala" filter="url(#soft)" x1="2" y1="${v}" x2="${w - 2}" y2="${v}"/>` : `<line class="detail" x1="${u0}" y1="${v}" x2="${w - 2}" y2="${v}"/>`;
        }
        s += `<g transform="${TOP(x0, 14, 3.6)}">${g}</g>`;
      }
      // jejak: tumbuh dari kitab ke kartu selama menyalin (paruh pertama), lalu baris kartu muncul
      const tumbuh = Math.min(1, st.salin * 2), pts = RUTE.slice(0, Math.max(2, Math.round(RUTE.length * tumbuh)));
      s += `<path class="wire" d="${K.path(RUTE)}"/>` + (st.salin > 0 ? `<path class="wire hot" d="${K.path(pts)}"/>` : '');
      s += api.simpul(A, st.salin > 0) + api.simpul(B, st.salin >= 1);
      const lit = st.salin >= 1 && st.cocok;
      // kartu kutipan berdiri; baris muncul satu per satu saat disalin
      const kartu = box(38, 8, 2, 16, 2, 22, 0, lit ? 'hot' : '');
      let g = '';
      const tampak = Math.floor(Math.max(0, st.salin * 2 - 1) * N + 1e-6);
      for (let i = 0; i < N; i++) {
        if (i >= tampak) break;
        const v = 4 + i * 2.6, beda = !st.cocok && i === 2;
        g += beda ? `<line class="wire" stroke-dasharray="1.2 1.2" x1="5" y1="${v}" x2="11" y2="${v}"/>`
          : `<line class="${lit ? 'nyala' : 'detail'}" x1="2" y1="${v}" x2="${i === N - 1 ? 9 : 14}" y2="${v}"/>`;
      }
      s += `<g class="${!st.cocok && st.salin >= 1 ? 'redup' : ''}">${kartu}<g transform="${FRONT(38, 10, 24)}">${g}</g>${K.tepi([[38,8,2],[54,8,2],[38,10,2],[54,10,2],[38,8,24],[54,8,24],[38,10,24],[54,10,24]])}</g>`;
      // lencana menempel di muka kartu (ikut bidang isometrik), tanpa garis penunjuk
      if (st.salin >= 1) s += api.lencanaBidang(st.cocok ? 'centang' : 'silang', FRONT(38, 10, 24), 12.4, 18, 3.2, st.cocok);
      api.gambar(s);
    }
    const read = () => api.readout(st.salin < 1 ? 'Menyalin dari kitab' : st.cocok ? 'Kutipan sama persis dengan sumber, jadi ditampilkan' : 'Kutipan tidak cocok dengan sumber, jadi tidak ditampilkan');
    const H = window.H = {
      salin(cocok, lalu) { if (st.busy) return api.readout('Sebentar, masih menyalin'); st.busy = true; st.cocok = cocok; st.salin = 0; draw();
        api.denyut(K.path(RUTE));
        api.anim(1400, t => { st.salin = t; draw(); }, () => { st.busy = false; draw(); read(); if (lalu) lalu(); }); },
    };
    draw(); read();
    return {
      render: draw,
      batal() { st.busy = false; },
      demo() { H.salin(false, () => api.after(900, () => H.salin(true))); },
      akhir() { st.salin = 1; st.cocok = true; draw(); read(); },
    };
  },
});
</script>
</body>
</html>
